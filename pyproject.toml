[project]
name = "darkhouse"
version = "0.1.0"
description = "Darkhouse — stateless Python FastAPI scan service (harvest stage: Playwright + axe-core)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.30.0",
    "playwright>=1.60.0",
    "ulid-py>=1.1.0",
    "jsonschema>=4.21.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
# Root is a virtual project only: the scanner is imported as services.scanner.*
# from the repo root (cwd on sys.path), never installed as a wheel.
package = false

[tool.pytest.ini_options]
testpaths = ["services/scanner/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
