<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Deferred SPA fixture (stability fallback)</title>
</head>
<body>
  <main id="app">
    <h1>Deferred SPA fixture (stability fallback)</h1>
    <p>Shell renders first, then a violating node is inserted ~300ms later.</p>
  </main>
  <script>
    // Unlike spa-deferred.html this page opens an infinitely streaming /hold
    // connection, so network idle never fires and the DOM-stability fallback
    // must gate axe.run(). The DOM stops changing after the deferred insert,
    // so the fallback should declare it stable and capture image-alt.
    setTimeout(function () {
      var img = document.createElement("img");
      img.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
      document.getElementById("app").appendChild(img);
    }, 300);
    fetch("hold");
  </script>
</body>
</html>
